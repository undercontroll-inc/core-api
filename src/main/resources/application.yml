spring:
  application:
    name: main-service
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  mvc:
    async:
      request-timeout: 120s

  task:
    scheduling:
      pool:
        size: 2

  http:
    client:
      connect-timeout: 5s
      read-timeout: 25s

  ai:
    model:
      chat: none
      audio:
        transcription: none
        speech: none
      embedding: none
      image: none
      moderation: none
    chat:
      client:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    ex:
      notification: "notification.events"
    routing-key:
      announcement: "announcement.created"
      user-created: "user.created"
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    enable:
      jvm: true
    distribution:
      sla:
        http:
          server:
            requests: 50ms, 100ms, 200ms, 300ms, 500ms, 1s
    tags:
      application: undercontroll-core-service
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{correlationId:-}] [%X{userId:-}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:undercontroll-dev-secret}
  # Access token expiration in minutes (default: 15 minutes)
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  # Refresh token expiration in days (default: 7 days)
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

rate-limit:
  # Max login attempts per minute per IP (brute-force protection)
  auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:10}
  # Max requests per minute per IP for all other endpoints
  general-requests-per-minute: ${RATE_LIMIT_GENERAL_RPM:100}

undercontroll:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
      project-id: ${GEMINI_PROJECT_ID:}
      location: ${GEMINI_LOCATION:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    ana:
      provider: ${ANA_PROVIDER:${INSIGHTS_PROVIDER:none}}
      model: ${ANA_MODEL:}
      timeout: ${ANA_TIMEOUT:60s}
      temperature: 0.2
      max-output-tokens: 1024
      thinking: ${ANA_THINKING:default}
      suggestion-count: 4
      suggestion-ttl-hours: 12
      memory-ttl-hours: 24
      memory-window: 10
      lock-ttl: 90s
      turn-timeout: ${ANA_TURN_TIMEOUT:60s}
      first-token-timeout: 30s
      idle-timeout: 20s
      max-tool-rounds: 2
      max-web-searches: 1
    insights:
      provider: ${INSIGHTS_PROVIDER:none}
      model: ${INSIGHTS_MODEL:}
      timeout: ${INSIGHTS_TIMEOUT:60s}
      temperature: 0.2
      max-output-tokens: 4096
      thinking: ${INSIGHTS_THINKING:low}
      prompt-version: "7"
      poll-interval: ${INSIGHTS_POLL_INTERVAL:5m}
      worker-interval: ${INSIGHTS_WORKER_INTERVAL:30s}
      job-deadline: ${INSIGHTS_JOB_DEADLINE:5m}
      lease-duration: 10m
      max-job-attempts: 3
      reschedule-delay: 5m
      max-insights: 7
      repair-catalog-days: 90
    transcription:
      provider: ${TRANSCRIPTION_PROVIDER:${INSIGHTS_PROVIDER:none}}
      model: ${TRANSCRIPTION_MODEL:}
      timeout: ${TRANSCRIPTION_TIMEOUT:60s}
      thinking: ${TRANSCRIPTION_THINKING:minimal}
      max-duration: 180s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
aws:
  accessKeyId: ${ACCESS_KEY_ID:example}
  secretAccessKey: ${SECRET_ACCESS_KEY:example}
  sessionToken: ${SESSION_TOKEN:example}
  region: us-east-1
  s3:
    # TODO: Mudar para ser dinamico
    export-bucket: undercontroll-dev-export-bucket
    upload-bucket: ${S3_UPLOAD_BUCKET:undercontroll-dev-upload-bucket}
    upload-expiration-minutes: ${S3_UPLOAD_EXPIRATION_MINUTES:15}
    read-expiration-minutes: ${S3_READ_EXPIRATION_MINUTES:1440}
