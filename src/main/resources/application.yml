spring:
  application:
    name: main-service
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  mvc:
    async:
      request-timeout: 120s

  http:
    client:
      connect-timeout: 5s
      read-timeout: 25s

  ai:
    retry:
      max-attempts: 1
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
          temperature: 0.2
      audio:
        transcription:
          options:
            model: whisper-1
            language: pt
            temperature: 0
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    ex:
      notification: "notification.events"
    routing-key:
      announcement: "announcement.created"
      user-created: "user.created"
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    enable:
      jvm: true
    distribution:
      sla:
        http:
          server:
            requests: 50ms, 100ms, 200ms, 300ms, 500ms, 1s
    tags:
      application: undercontroll-core-service
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{correlationId:-}] [%X{userId:-}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:undercontroll-dev-secret}
  # Access token expiration in minutes (default: 15 minutes)
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  # Refresh token expiration in days (default: 7 days)
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

rate-limit:
  # Max login attempts per minute per IP (brute-force protection)
  auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:10}
  # Max requests per minute per IP for all other endpoints
  general-requests-per-minute: ${RATE_LIMIT_GENERAL_RPM:100}

undercontroll:
  insights:
    provider: ${INSIGHTS_PROVIDER:none}
    prompt-version: "6"
    cron: "0 0 4 1 * *"
    openai-model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
    gemini-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
    max-insights: 7
    repair-catalog-days: 90
  transcription:
    gemini-model: ${GEMINI_TRANSCRIBE_MODEL:gemini-3.5-flash-lite}
  ana:
    suggestion-count: 4
    suggestion-ttl-hours: 12
    memory-ttl-hours: 24
    memory-window: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
aws:
  accessKeyId: ${ACCESS_KEY_ID:example}
  secretAccessKey: ${SECRET_ACCESS_KEY:example}
  sessionToken: ${SESSION_TOKEN:example}
  region: us-east-1
  s3:
    # TODO: Mudar para ser dinamico
    export-bucket: undercontroll-dev-export-bucket
    upload-bucket: ${S3_UPLOAD_BUCKET:undercontroll-dev-upload-bucket}
    upload-expiration-minutes: ${S3_UPLOAD_EXPIRATION_MINUTES:15}
    read-expiration-minutes: ${S3_READ_EXPIRATION_MINUTES:1440}
