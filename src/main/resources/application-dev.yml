spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: redis
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: rabbitmq
    password: rabbitmq
    dynamic: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/undercontroll}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:undercontroll}
    password: ${DB_PASSWORD:undercontroll}

  # H2 — descomente este bloco e comente o datasource postgres acima para voltar
  # datasource:
  #   url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER,VALUE
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
  # H2 usava create-drop (banco em memória). Descomente se voltar ao H2:
  # jpa:
  #   hibernate:
  #     ddl-auto: create-drop
  #   show-sql: true

  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false
  # H2 console — ative junto com o datasource H2
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console
  #     settings:
  #       web-allow-others: false
aws:
  s3:
    upload-bucket: "undercontroll-dev-announcement-image-upload"
    read-expiration-minutes: 1440

jwt:
  secret: undercontroll-dev-secret
  # Access token expiration in minutes (default: 15 minutes)
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  # Refresh token expiration in days (default: 7 days)
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

undercontroll:
  seed:
    password: ${DEV_SEED_PASSWORD:}
