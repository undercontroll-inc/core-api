spring:
  application:
    name: main-service-test
  mail:
    host: localhost
    port: 25
    username: test
    password: test
  cache:
    type: simple
  mvc:
    async:
      request-timeout: 120s
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    ex:
      notification: "notification.events"
    routing-key:
      announcement: "announcement.created"
      user-created: "user.created"
  task:
    scheduling:
      enabled: false
  ai:
    model:
      chat: none
      audio:
        transcription: none
        speech: none
      embedding: none
      image: none
      moderation: none
    chat:
      client:
        enabled: false

jwt:
  secret: test-secret-key-for-unit-tests

undercontroll:
  ai:
    ana:
      provider: none
      suggestion-count: 4
      suggestion-ttl-hours: 12
      memory-ttl-hours: 24
      memory-window: 10
    insights:
      provider: none
      prompt-version: "7"
      cron: "0 0 4 1 * *"
      max-insights: 7
      repair-catalog-days: 90
    transcription:
      provider: none

logging:
  level:
    root: ERROR
