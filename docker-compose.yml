services:
  postgres:
    image: postgres:16-alpine
    container_name: undercontroll-test-db
    environment:
      POSTGRES_DB: undercontroll
      POSTGRES_USER: undercontroll
      POSTGRES_PASSWORD: undercontroll
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undercontroll"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: undercontroll-test-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: undercontroll-test-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: undercontroll-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: undercontroll-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/undercontroll-uploads &&
      mc mb --ignore-existing local/undercontroll-exports &&
      mc anonymous set none local/undercontroll-uploads &&
      mc anonymous set none local/undercontroll-exports &&
      (mc ilm rule ls local/undercontroll-uploads 2>/dev/null | grep -q label-scans || mc ilm rule add --expire-days 1 --prefix label-scans/ local/undercontroll-uploads)
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: undercontroll-test-app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/undercontroll
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: undercontroll
      DB_PASSWORD: undercontroll
      REDIS_HOST: redis
      REDIS_PASSWORD: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: rabbitmq
      RABBITMQ_PASSWORD: rabbitmq
      JWT_SECRET: test-secret-only-for-local-migration-testing
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      ACCESS_KEY_ID: test
      SECRET_ACCESS_KEY: test
      SESSION_TOKEN: test
    ports:
      - "8080:8080"
    volumes:
      - ./src/main/resources/firebase-service-account.json:/opt/app/firebase-service-account.json:ro
  notification:
    build:
      context: ../notification-api
      dockerfile: Dockerfile
    container_name: undercontroll-test-notification
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: rabbitmq
      RABBITMQ_PASSWORD: rabbitmq
      MAIN_SERVICE_HOST: app
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
    ports:
      - "8081:8081"

volumes:
  postgres-data:
  redis_data:
  minio_data:
